<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprova+ | Cursinho online para ENEM e vestibulares</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1B3D;--violet:#5B4BDB;--bg:#F4F5FA;--card:#fff;--ink:#16203F;--mut:#5E6783;--line:#E2E5F0;--green:#1FA971;--red:#D64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1226;--card:#131D3A;--ink:#EDF0FA;--mut:#A3ACC8;--line:#26325A;--violet:#8B7DFF}}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;color:var(--ink)}h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.02em}h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 22px;font:700 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .15s;background:var(--violet);color:#fff}
.btn:hover{transform:translateY(-1px);opacity:.92}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.full{width:100%}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}.logo{font-weight:800;font-size:22px;color:#fff;text-decoration:none}.logo b{color:#A99BFF}
header nav{display:flex;gap:18px;margin-left:auto;align-items:center}header nav a{color:#D6DBF0;text-decoration:none;font-size:14px}
.demo{background:#FFF4D6;color:#5A4300;text-align:center;font-size:13px;padding:6px 12px}
.hero{background:var(--navy);color:#fff;padding:64px 0 80px}.hero h1{color:#fff}.hero .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p{color:#C9CFE8;font-size:18px;max-width:52ch}.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.hero .btn.ghost{color:#fff;border-color:#3A4876}
.mock{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .5s}
section.s{padding:64px 0}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.card h3{font-size:17px}.card p{color:var(--mut);margin:0;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:stretch}
.plan{display:flex;flex-direction:column;gap:10px}.plan.best{border:2px solid var(--violet);position:relative}.tag{position:absolute;top:-13px;left:20px;background:var(--violet);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px}
.price{font-size:32px;font-weight:800}.price small{font-size:14px;font-weight:500;color:var(--mut)}.plan ul{padding-left:18px;margin:0;color:var(--mut);font-size:14.5px;flex:1}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--violet);color:#fff;font-weight:800;margin-bottom:10px}
footer{background:var(--navy);color:#A9B1CF;padding:30px 0;font-size:13px}
.center{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 16px}.box{width:100%;max-width:440px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}input,select{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.msg{padding:10px 14px;border-radius:10px;font-size:14px;margin-top:14px}.msg.err{background:#FBE4E4;color:#7A1F1F}.msg.ok{background:#DDF5EA;color:#0E5B3C}.msg.info{background:#E8E6FB;color:#2C2380}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px}
.side a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:500;font-size:14.5px;margin-bottom:2px}.side a.on{background:var(--violet);color:#fff}.side a.soon{color:var(--mut);cursor:default}
.main{padding:28px;min-width:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.stat b{font-size:28px;display:block}.stat span{color:var(--mut);font-size:13px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.done{color:var(--green);font-weight:700}
.video{aspect-ratio:16/9;background:var(--navy);border-radius:16px;display:grid;place-items:center;color:#C9CFE8;text-align:center;padding:20px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.opt.right{border-color:var(--green);background:#DDF5EA;color:#0E5B3C}.opt.wrong{border-color:var(--red);background:#FBE4E4;color:#7A1F1F}
.mod{position:fixed;inset:0;background:rgba(10,15,35,.6);display:grid;place-items:center;z-index:50;padding:16px}.mod .card{max-width:420px}.bar i{display:block}.empty{color:var(--mut);text-align:center;padding:26px}
@media(max-width:820px){.hero .grid{grid-template-columns:1fr}header nav a.h{display:none}.app{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side a{white-space:nowrap}.main{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="demo">Modo demonstração: pagamento, e-mail e conteúdo são simulados. Nada aqui é uma aula, nota ou resultado real.</div>
<header class="top"><div class="wrap"><a class="logo" href="#inicio">Aprova<b>+</b></a><nav id="nav"></nav></div></header>
<main id="v"></main>
<footer><div class="wrap">Aprova+ é um nome provisório. Preços e textos são editáveis no objeto CONFIG no início do script.</div></footer>
<script>
const CONFIG={plans:[
{id:'mensal',nome:'Plano mensal',meses:1,parcelas:1,valor:59.90,itens:['Todas as disciplinas','Videoaulas','Exercícios','Materiais de estudo','Simulados']},
{id:'semestral',nome:'Plano semestral',meses:6,parcelas:6,valor:49.90,itens:['6 meses de acesso','Todos os recursos do mensal']},
{id:'anual',nome:'Plano anual',meses:12,parcelas:12,valor:39.90,best:true,itens:['12 meses de acesso','Todos os materiais','Simulados completos','Cronograma personalizado','Recursos de redação']}]};
const SUBJ={Matemática:['Funções','Geometria plana','Probabilidade'],Física:['Cinemática','Dinâmica','Eletricidade'],Química:['Estequiometria','Ligações químicas','Química orgânica'],Biologia:['Citologia','Genética','Ecologia'],Português:['Interpretação de texto','Gramática'],História:['Brasil República','Idade Moderna'],Geografia:['Climatologia','Geopolítica']};
const QS=[{d:'Matemática',q:'(Exemplo demonstrativo) Qual é o valor de f(3) se f(x) = 2x + 1?',o:['5','6','7','8','9'],a:2,r:'Substituindo x por 3: 2·3 + 1 = 7.'},
{d:'Física',q:'(Exemplo demonstrativo) Um carro percorre 120 km em 2 h, em velocidade constante. Qual é sua velocidade?',o:['30 km/h','45 km/h','60 km/h','90 km/h','240 km/h'],a:2,r:'v = distância ÷ tempo = 120 ÷ 2 = 60 km/h.'},
{d:'Química',q:'(Exemplo demonstrativo) Quantos mols há em 36 g de água (H₂O, 18 g/mol)?',o:['0,5','1','2','3','18'],a:2,r:'n = massa ÷ massa molar = 36 ÷ 18 = 2 mol.'}];
const $=s=>document.querySelector(s),R=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sess=()=>R('sess',null),accts=()=>R('accts',{}),prog=()=>R('prog:'+(sess()||''),{done:{},ans:{}});
const savep=p=>W('prog:'+sess(),p);
function priceTxt(p){return p.parcelas>1?`<div class="price">${p.parcelas}x ${money(p.valor)}</div><small>Total ${money(p.valor*p.parcelas)} em ${p.parcelas} parcelas no cartão. Não é assinatura recorrente.</small>`:`<div class="price">${money(p.valor)}<small> /mês</small></div><small>Pagamento de ${p.meses} mês de acesso.</small>`}
function nav(){const l=sess();$('#nav').innerHTML=l?`<a class="h" href="#painel">Meu painel</a><a href="#" id="out">Sair</a>`:`<a class="h" href="#inicio">Início</a><a class="h" href="#como">Como funciona</a><a class="h" href="#disciplinas">Disciplinas</a><a class="h" href="#planos">Planos</a><a href="#login">Entrar</a><a class="btn" href="#planos">Quero estudar</a>`;const o=$('#out');if(o)o.onclick=e=>{e.preventDefault();W('sess',null);location.hash='#inicio';route()}}
function home(){return`<section class="hero"><div class="wrap grid"><div><h1>Seu futuro começa com a próxima aprovação.</h1><p>Prepare-se para o ENEM, Unicamp, Fuvest e os principais vestibulares do Brasil com uma metodologia de estudos organizada, conteúdos completos e ferramentas para acompanhar sua evolução.</p><div class="row"><a class="btn" href="#como">Conhecer o curso</a><a class="btn ghost" href="#planos">Ver planos</a></div></div>
<div class="mock" aria-label="Prévia da plataforma (ilustrativa)"><b>Olá, aluno! Vamos continuar sua preparação?</b><p style="color:var(--mut);font-size:13px;margin:4px 0 14px">Prévia ilustrativa, sem dados reais</p><div class="bar"><i style="width:35%"></i></div><p style="font-size:13px;color:var(--mut)">Progresso geral</p><div class="lesson"><span>Funções: aula 1</span><span class="done">Concluída</span></div><div class="lesson"><span>Cinemática: aula 1</span><span style="color:var(--violet)">Próxima</span></div></div></div></section>
<section class="s" id="como"><div class="wrap"><h2>O que você vai encontrar</h2><div class="grid3">${[['Videoaulas completas','Aulas por disciplina, organizadas em módulos.'],['Exercícios com resolução','Questões com cinco alternativas e comentário.'],['Simulados','Provas cronometradas no estilo dos vestibulares.'],['Correção de redações','Espaço para escrever e receber feedback.'],['Cronograma de estudos','Organize sua semana por matéria.'],['Acompanhamento de desempenho','Veja sua evolução por disciplina.'],['Materiais em PDF','Resumos e listas para baixar.'],['Preparação específica','Foco em ENEM, Unicamp, Fuvest e UNESP.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>
<section class="s" id="disciplinas" style="padding-top:0"><div class="wrap"><h2>Disciplinas</h2><div class="chips">${['Matemática','Física','Química','Biologia','Português','Literatura','Redação','História','Geografia','Filosofia','Sociologia','Inglês'].map(x=>`<span class="chip">${x}</span>`).join('')}</div><h2 style="margin-top:40px">Vestibulares preparados</h2><div class="grid3">${[['ENEM','Matriz de competências e redação nota 1000 em foco.'],['Unicamp','Questões dissertativas e interdisciplinares.'],['Fuvest','Primeira e segunda fase.'],['UNESP','Provas e leitura das obras indicadas.'],['Outros vestibulares','Conteúdo base para as demais provas.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>
<section class="s" style="padding-top:0"><div class="wrap"><h2>Como funciona</h2><div class="steps"><div class="card"><h3>Adquira seu acesso</h3><p>Escolha um plano e informe seus dados.</p></div><div class="card"><h3>Receba seus dados por e-mail</h3><p>Após a confirmação do pagamento, você recebe um link seguro para criar sua senha.</p></div><div class="card"><h3>Entre e comece a estudar</h3><p>Acesse a plataforma com seu e-mail e senha.</p></div></div></div></section>
<section class="s" id="planos" style="padding-top:0"><div class="wrap"><h2>Planos</h2><div class="plans">${CONFIG.plans.map(p=>`<div class="card plan ${p.best?'best':''}">${p.best?'<span class="tag">MAIS VANTAJOSO</span>':''}<h3>${p.nome}</h3>${priceTxt(p)}<ul>${p.itens.map(i=>`<li>${i}</li>`).join('')}</ul><a class="btn full" href="#compra-${p.id}">Comprar agora</a></div>`).join('')}</div></div></section>`}
function compra(id){const p=CONFIG.plans.find(x=>x.id===id);if(!p)return home();return`<div class="center"><div class="box card"><h2>Finalize seu acesso</h2><div class="card" style="background:var(--bg)"><b>${p.nome}</b>${priceTxt(p)}<ul style="margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14px">${p.itens.map(i=>`<li>${i}</li>`).join('')}</ul></div>
<form id="f" novalidate><label for="n">Nome completo</label><input id="n" autocomplete="name"><label for="e">E-mail para receber o acesso</label><input id="e" type="email" autocomplete="email"><label for="e2">Confirme o e-mail</label><input id="e2" type="email"><div id="m"></div><button class="btn full" style="margin-top:18px">Continuar para pagamento</button></form><p style="font-size:12px;color:var(--mut)">Pagamento via PIX e cartão (Mercado Pago ou Stripe) será ligado aqui. Nesta demonstração, a aprovação é simulada.</p><a href="#planos">Voltar aos planos</a></div></div>`}
function bindCompra(id){const p=CONFIG.plans.find(x=>x.id===id);if(!p)return;$('#f').onsubmit=e=>{e.preventDefault();const n=$('#n').value.trim(),m=$('#e').value.trim().toLowerCase(),m2=$('#e2').value.trim().toLowerCase();const err=t=>$('#m').innerHTML=`<div class="msg err" role="alert">${t}</div>`;
if(n.split(/\s+/).length<2)return err('Informe seu nome completo.');if(!/^\S+@\S+\.\S+$/.test(m))return err('Informe um e-mail válido.');if(m!==m2)return err('Os e-mails não são iguais.');
$('#f').innerHTML=`<div class="msg info">Pagamento pendente. O acesso só é liberado após a confirmação do gateway.</div><button class="btn full" id="ok" style="margin-top:14px">Simular pagamento aprovado (demo)</button>`;
$('#ok').onclick=()=>{const a=accts();const fim=new Date();fim.setMonth(fim.getMonth()+p.meses);a[m]={nome:n,plano:p.nome,fim:fim.toISOString(),compra:{plano:p.nome,total:p.valor*p.parcelas,data:new Date().toISOString()},senha:null};W('accts',a);W('pend',m);location.hash='#sucesso';route()}}}
function sucesso(){const m=R('pend',null);if(!m)return home();return`<div class="center"><div class="box card"><h2>Pagamento aprovado! Seu próximo passo rumo à aprovação começa agora.</h2><p>Enviamos os dados de acesso para <b>${m}</b>. Nenhuma senha é enviada por e-mail: você recebe um link seguro para criá-la.</p><div class="msg info">Demo: nenhum e-mail foi enviado de verdade. Use o botão abaixo no lugar do link.</div><form id="f"><label for="s">Crie sua senha (mínimo 8 caracteres)</label><input id="s" type="password" autocomplete="new-password"><div id="m"></div><button class="btn full" style="margin-top:14px">Salvar senha e entrar</button></form></div></div>`}
function bindSucesso(){const f=$('#f');if(!f)return;f.onsubmit=e=>{e.preventDefault();const s=$('#s').value;if(s.length<8)return $('#m').innerHTML='<div class="msg err" role="alert">A senha precisa ter pelo menos 8 caracteres.</div>';const m=R('pend',null),a=accts();a[m].senha=btoa(unescape(encodeURIComponent(s)));W('accts',a);W('pend',null);W('sess',m);location.hash='#painel';route()}}
function login(){return`<div class="center"><div class="box card"><a class="logo" style="color:var(--ink)" href="#inicio">Aprova<b style="color:var(--violet)">+</b></a><h2 style="margin-top:14px">Entrar na plataforma</h2><form id="f"><label for="e">E-mail</label><input id="e" type="email" autocomplete="email"><label for="s">Senha</label><input id="s" type="password" autocomplete="current-password"><div id="m"></div><button class="btn full" style="margin-top:16px">Entrar na plataforma</button></form><p><a href="#esqueci">Esqueci minha senha</a> · <a href="#inicio">Voltar ao site</a></p><p style="font-size:12px;color:var(--mut)">Contas só são criadas pela compra ou por um administrador.</p></div></div>`}
function bindLogin(){$('#f').onsubmit=e=>{e.preventDefault();const m=$('#e').value.trim().toLowerCase(),a=accts()[m];let ok=false;try{ok=a&&a.senha&&a.senha===btoa(unescape(encodeURIComponent($('#s').value)))}catch(x){}
if(!ok)return $('#m').innerHTML='<div class="msg err" role="alert">Não encontramos uma conta ativa com esses dados. Verifique suas informações ou adquira um de nossos planos.</div>';W('sess',m);location.hash='#painel';route()}}
function esqueci(){return`<div class="center"><div class="box card"><h2>Recuperar senha</h2><form id="f"><label for="e">E-mail da conta</label><input id="e" type="email"><div id="m"></div><button class="btn full" style="margin-top:14px">Enviar link</button></form><p><a href="#login">Voltar</a></p></div></div>`}
function bindEsqueci(){$('#f').onsubmit=e=>{e.preventDefault();$('#m').innerHTML='<div class="msg ok">Se houver uma conta ativa com este e-mail, enviaremos um link para criar uma nova senha. (Demo: nenhum e-mail é enviado.)</div>'}}
const side=on=>`<aside class="side">${[['painel','Visão geral'],['aulas','Minhas aulas'],['exercicios','Exercícios'],['simulados','Simulados'],['evolucao','Minha evolução']].map(x=>`<a href="#${x[0]}" class="${on===x[0]?'on':''}">${x[1]}</a>`).join('')}${['Redação','Cronograma','Meu desempenho','Materiais','Minha conta'].map(x=>`<a class="soon" title="Em breve">${x} (em breve)</a>`).join('')}</aside>`;
const ALL=()=>Object.entries(SUBJ).flatMap(([d,ms])=>ms.map(m=>d+'|'+m));
function painel(){sweep();const S=stats(sess()),a=accts()[sess()],p=prog(),tot=ALL().length,dn=Object.keys(p.done).length,an0=Object.values(p.ans),ac=an0.filter(x=>x).length+S.ac,an={length:an0.length+S.resp},pc=Math.round(dn/tot*100);
return`<div class="app">${side('painel')}<div class="main"><h1 style="font-size:2rem">Olá, ${a.nome.split(' ')[0]}! Vamos continuar sua preparação?</h1><div class="stats"><div class="card stat"><b>${pc}%</b><span>Progresso geral</span><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div></div><div class="card stat"><b>${dn}/${tot}</b><span>Aulas concluídas</span></div><div class="card stat"><b>${an.length}</b><span>Questões respondidas</span></div><div class="card stat"><b>${an.length?Math.round(ac/an.length*100)+'%':'–'}</b><span>Aproveitamento</span></div></div>
<div class="card"><h3>Sua assinatura</h3><p>${a.plano}, com acesso até ${new Date(a.fim).toLocaleDateString('pt-BR')}.</p></div><div class="card" style="margin-top:14px"><h3>Pontuação e nível</h3><p><b>${S.pts} pontos</b> · Nível ${S.lv[0]} · ${S.bad.filter(Boolean).length}/${BAD.length} conquistas · ${S.n} simulado(s). <a href="#evolucao">Ver minha evolução</a></p></div><div class="card" style="margin-top:14px"><h3>Próxima atividade</h3>${dn<tot?`<p>Continue em <a href="#aulas">Minhas aulas</a>.</p>`:'<p>Você concluiu todas as aulas de demonstração.</p>'}</div></div></div>`}
function aulas(){const p=prog();return`<div class="app">${side('aulas')}<div class="main"><h1 style="font-size:2rem">Minhas aulas</h1><p style="color:var(--mut)">Conteúdo demonstrativo. Os vídeos reais entram pelo painel administrativo.</p>${Object.entries(SUBJ).map(([d,ms])=>`<div class="card" style="margin-bottom:14px"><h3>${d}</h3>${ms.map(m=>{const k=d+'|'+m;return`<div class="lesson"><span>${m}</span>${p.done[k]?'<span class="done">Concluída</span>':''}<a class="btn ghost" href="#aula-${encodeURIComponent(k)}">Abrir</a></div>`}).join('')}</div>`).join('')}</div></div>`}
